<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Catálogo AR</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      /* Estilo para el muro de registro */
      #login-screen {
        position: absolute; z-index: 1000; top: 0; left: 0; width: 100%; height: 100%;
        background: white; display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      .hidden { display: none !important; }
    </style>
  </head>

  <body>
    <div id="login-screen">
      <h1>Bienvenido al Catálogo</h1>
      <p>Introduce tu código de acceso:</p>
      <input type="password" id="password-input">
      <button onclick="checkLogin()">Entrar</button>
    </div>

    <a-scene id="ar-scene" mindar-image="imageTargetSrc: ./targets.mind;" class="hidden" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
      <button onclick="cerrarSesion()" style="position: absolute; bottom: 20px; left: 20px; z-index: 9999; padding: 10px; background: red; color: white; border: none; border-radius: 5px;">
        Probar Login de nuevo
      </button>

<!-- Foto 0 -->
<a-entity mindar-image-target="targetIndex: 0">
  <a-video src="#video0" width="1" height="0.55" position="0 0 0"></a-video>
</a-entity>

<!-- Foto 1 -->
<a-entity mindar-image-target="targetIndex: 1">
  <a-video src="#video1" width="1" height="0.55" position="0 0 0"></a-video>
</a-entity>

<!-- Foto 2-->
<a-entity mindar-image-target="targetIndex: 2">
  <a-video src="#video2" width="1" height="0.55" position="0 0 0"></a-video>
</a-entity>    </a-scene>

<!-- Foto 3-->
<a-entity mindar-image-target="targetIndex: 3">
  <a-video src="#video3" width="1" height="0.55" position="0 0 0"></a-video>
</a-entity>    </a-scene>



    <a-assets>
        <video id="video0" src="./video0.mp4" preload="auto" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video1" src="./video1.mp4" preload="auto" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video2" src="./video2.mp4" preload="auto" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video3" src="./video3.mp4" preload="auto" loop="true" muted playsinline webkit-playsinline></video>
    </a-assets>

    <script>
      // Función para comprobar el acceso y la "cookie" (Local Storage)
      window.onload = () => {
        if (localStorage.getItem("acceso-concedido") === "true") {
          mostrarAR();
        }
      };

      function checkLogin() {
        const pass = document.getElementById("password-input").value;
        if (pass === "1234") { // Aquí pones la contraseña que quieras
          localStorage.setItem("acceso-concedido", "true");
          mostrarAR();
        } else {
          alert("Código+ incorrecto");
        }
      }

function mostrarAR() {
  // 1. Ocultamos la pantalla de login y mostramos la cámara
  document.getElementById("login-screen").classList.add("hidden");
  document.getElementById("ar-scene").classList.remove("hidden");
  
  // 2. Desbloqueamos TODOS los vídeos que existan en la página de forma segura
  const todosLosVideos = document.querySelectorAll('video');
  
  todosLosVideos.forEach(video => {
    // Les damos un micro-reproducción y los pausamos al instante
    // Esto le dice al móvil: "El usuario ha hecho clic, dale permiso a este vídeo"
    video.play()
      .then(() => {
        video.pause();
      })
      .catch(error => {
        console.log("Audio desbloqueado para más tarde");
      });
  });
}
    </script>
    <script>
  // Este código detecta cuando una imagen aparece en cámara y da Play al vídeo correcto
  const targets = document.querySelectorAll('[mindar-image-target]');
  
  targets.forEach((target, index) => {
    target.addEventListener("targetFound", event => {
      console.log("Imagen encontrada: " + index);
      // Buscamos el vídeo dentro de este target y le damos Play
      const video = document.querySelector(`#video${index + 1}`);
      video.play();
    });

    target.addEventListener("targetLost", event => {
      console.log("Imagen perdida: " + index);
      const video = document.querySelector(`#video${index + 1}`);
      video.pause();
    });
  });
  function cerrarSesion() {
  localStorage.removeItem("acceso-concedido"); // Borra la "cookie"
  location.reload(); // Recarga la página para que vuelva a pedir contraseña
}
</script>
  </body>
</html>
