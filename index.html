<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mi Catálogo AR</title>
    
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

    <style>
      #login-screen {
        position: fixed; z-index: 9999; top: 0; left: 0; width: 100%; height: 100%;
        background: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center;
      }
      .hidden { display: none !important; }
      
      #btn-logout {
        position: fixed; bottom: 20px; left: 20px; z-index: 9998; 
        padding: 12px 20px; background: #dc3545; color: white; 
        border: none; border-radius: 5px; font-weight: bold; cursor: pointer;
      }
    </style>
  </head>

  <body>

    <div id="login-screen">
      <div id="pass-section">
        <h1>Bienvenido al Catálogo</h1>
        <p>Introduce tu código de acceso:</p>
        <input type="text" id="password-input" autocomplete="off" style="padding: 10px; font-size: 16px; -webkit-text-security: disc;">
        <button id="btn-entrar" onclick="checkLogin()" style="padding: 10px 20px; font-size: 16px;">Entrar</button>
      </div>

      <div id="ready-section" class="hidden" style="text-align: center; padding: 20px;">
        <h1>¡Código Correcto!</h1>
        <p>Toca el botón de abajo para activar la cámara y los vídeos:</p>
        <button id="btn-activar-ar" onclick="desbloquearYEntrar()" style="padding: 20px 40px; font-size: 20px; background: #28a745; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold;">
          🚀 ENTRAR AL CATÁLOGO
        </button>
      </div>
    </div>

    <button id="btn-logout" class="hidden" onclick="cerrarSesion()">
      🔄 Probar Login de nuevo
    </button>

    <a-scene id="ar-scene" 
             mindar-image="imageTargetSrc: ./targets.mind; filterMinCF:0.001; filterBeta: 0.01; autoStart: false;" 
             class="hidden"
             color-space="sRGB" 
             renderer="colorManagement: true, physicallyCorrectLights: true" 
             vr-mode-ui="enabled: false" 
             device-orientation-permission-ui="enabled: true">
             
      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0"><a-video src="#video0" width="1" height="0.55" position="0 0 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 1"><a-video src="#video1" width="1" height="1.81" position="0 -0.1 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 2"><a-video src="#video2" width="1" height="1.81" position="0 -0.1 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 3"><a-video src="#video3" width="1" height="1.81" position="0 -0.01 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 4"><a-video src="#video4" width="1" height="1.81" position="0 -0.01 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 5"><a-video src="#video5" width="1" height="1.81" position="0 -0.01 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 6"><a-video src="#video6" width="1" height="0.55" position="0 0 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 7"><a-video src="#video7" width="1" height="1.81" position="0 -0.01 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 8"><a-video src="#video8" width="1" height="1.81" position="0 -0.01 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 9"><a-video src="#video9" width="1" height="0.55" position="0 0 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 10"><a-video src="#video10" width="1" height="1.81g" position="0 -0.01 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 11"><a-video src="#video11" width="1" height="1.81" position="0 -0.01 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 12"><a-video src="#video12" width="1" height="0.80" position="0 -0.01 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 13"><a-video src="#video13" width="1" height="0.80" position="0 -0.01 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 14"><a-video src="#video14" width="1" height="0.80" position="0 -0.01 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 15"><a-video src="#video15" width="1" height="0.80" position="0 -0.01 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 16"><a-video src="#video16" width="1" height="0.80" position="0 -0.01 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 17"><a-video src="#video17" width="1" height="0.80" position="0 -0.01 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 18"><a-video src="#video18" width="1" height="1.81" position="0 -0.01 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 19"><a-video src="#video19" width="1" height="1.81" position="0 -0.01 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 20"><a-video src="#video20" width="1" height="1.81" position="0 -0.01 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 21"><a-video src="#video21" width="1" height="1.81" position="0 -0.01 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 22"><a-video src="#video22" width="1" height="1.81" position="0 -0.01 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 23"><a-video src="#video23" width="1" height="1.81" position="0 -0.01 0"></a-video></a-entity>
      <a-entity mindar-image-target="targetIndex: 24"><a-video src="#video24" width="1" height="1.81" position="0 -0.01 0"></a-video></a-entity>

    </a-scene>

    <a-assets>
        <video id="video0" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video1" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video2" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video3" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video4" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video5" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video6" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video7" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video8" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video9" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video10" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video11" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video12" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video13" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video14" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video15" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video16" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video17" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video18" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video19" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video20" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video21" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video22" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video23" loop="true" muted playsinline webkit-playsinline></video>
        <video id="video24" loop="true" muted playsinline webkit-playsinline></video>
    </a-assets>

    <script>
      window.onload = () => {
        if (localStorage.getItem("acceso-concedido") === "true") {
          document.getElementById("pass-section").classList.add("hidden");
          document.getElementById("ready-section").classList.remove("hidden");
        }
      };

      function checkLogin() {
        const pass = document.getElementById("password-input").value;
        if (pass === "1234") { 
          localStorage.setItem("acceso-concedido", "true");
          document.getElementById("pass-section").classList.add("hidden");
          document.getElementById("ready-section").classList.remove("hidden");
        } else {
          alert("Código incorrecto");
        }
      }

      // Al entrar solo damos acceso general, ya no forzamos la precarga masiva que rompía el navegador
      function desbloquearYEntrar() {
        document.getElementById("login-screen").classList.add("hidden");
        document.getElementById("ar-scene").classList.remove("hidden");
        document.getElementById("btn-logout").classList.remove("hidden");
        
        const sceneEl = document.querySelector('a-scene');
        const arSystem = sceneEl.systems["mindar-image-system"];
        if (arSystem) {
          arSystem.start();
        }
      }

      function cerrarSesion() {
        localStorage.removeItem("acceso-concedido");
        location.reload();
      }

      // SISTEMA DE CARGA DINÁMICA (Solo carga el vídeo que se está viendo)
      const sceneEl = document.querySelector('a-scene');
      sceneEl.addEventListener("arReady", (event) => {
        console.log("Escáner listo");
        const targets = document.querySelectorAll('[mindar-image-target]');
        
        targets.forEach((target, index) => {
          
          // CUANDO LA CÁMARA ENCUENTRA LA IMAGEN
          target.addEventListener("targetFound", event => {
            const video = document.querySelector(`#video${index}`);
            if (video) {
              // Si el vídeo no tiene ruta asignada todavía, se la ponemos al vuelo
              if (!video.src || video.src === "") {
                video.src = `./video${index}.webm`;
                video.load(); // Lo carga al instante de forma aislada
              }
              video.muted = false; 
              video.play().catch(e => console.log("Esperando interacción de audio"));
            }
          });

          // CUANDO LA CÁMARA PIERDE LA IMAGEN
          target.addEventListener("targetLost", event => {
            const video = document.querySelector(`#video${index}`);
            if (video) {
              video.pause();
              // Vaciamos el recurso para liberar por completo la memoria del teléfono
              video.src = ""; 
              video.load();
            }
          });
          
        });
      });
    </script>

  </body>
</html>
